<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f4">
<title>Foresight</title>
<style>
:root{--bg:#f4f4f4;--card:#fff;--ink:#141414;--mut:#6b6b6b;--line:#e4e4e4;--acc:#141414;--accbg:#e6e6e6;--chip:#ececec;--rec:#d93025;--sh:0 2px 10px rgba(0,0,0,.08);--err:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1c1c1c;--ink:#ededed;--mut:#9a9a9a;--line:#2c2c2c;--acc:#ededed;--accbg:#2c2c2c;--chip:#262626;--sh:0 2px 10px rgba(0,0,0,.4);--err:#f2b8b5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121212;--card:#1c1c1c;--ink:#ededed;--mut:#9a9a9a;--line:#2c2c2c;--acc:#ededed;--accbg:#2c2c2c;--chip:#262626;--sh:0 2px 10px rgba(0,0,0,.4);--err:#f2b8b5;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Google Sans",Roboto,system-ui,-apple-system,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);max-width:640px;margin:0 auto}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;align-items:center;gap:8px;padding:10px 14px 4px}
.logo{width:26px;height:26px;border-radius:50%;background:conic-gradient(#e2e2e2,#9a9a9a,#f3f3f3,#b5b5b5,#e2e2e2);flex:none}
.top h1{font-size:17px;font-weight:500;margin:0;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:12px;color:var(--mut);white-space:nowrap}
.rec{margin:0 14px 8px;background:var(--card);box-shadow:var(--sh);border-radius:22px;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rec);flex:none;opacity:.35}
.rec.on .dot{opacity:1}
#time{font-weight:500;font-variant-numeric:tabular-nums}
#wave{flex:1;display:flex;align-items:center;justify-content:space-between;height:26px;min-width:0}
#wave i{display:block;width:3px;border-radius:2px;background:var(--mut);height:4px;transition:height .12s}
#pp{width:40px;height:40px;border-radius:50%;background:var(--acc);color:var(--card);display:grid;place-items:center;flex:none}
main{flex:1;overflow-y:auto;padding:0 14px 12px;min-height:0}
section{display:none}
section.on{display:block}
.head{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
.rb{width:40px;height:40px;border-radius:50%;background:var(--chip);display:grid;place-items:center;border:1px solid var(--line)}
.big{font-size:21px;font-weight:500;margin:8px 0 12px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 14px;border-radius:18px;color:var(--mut);white-space:nowrap}
.tab.on{background:var(--acc);color:var(--card);font-weight:500}
.card{background:var(--card);border-radius:22px;padding:12px;min-height:46vh;display:flex;flex-direction:column}
.tool{display:flex;align-items:center;gap:2px;margin-bottom:10px;flex-wrap:wrap}
.tool button{width:34px;height:34px;border-radius:8px;display:grid;place-items:center}
.tool .sp{flex:1}
.pill{background:var(--chip);border-radius:16px;padding:6px 12px;font-size:13px;color:var(--mut)}
.pill.live{background:var(--acc);color:var(--card)}
.seg{display:flex;background:var(--chip);border-radius:14px;padding:3px;margin-bottom:10px}
.seg button{flex:1;padding:7px 4px;border-radius:11px;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.lab{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:6px}
.badge{background:var(--chip);color:var(--ink);border-radius:10px;padding:1px 8px;font-size:11px;font-weight:500}
textarea,.fld{font:inherit;color:inherit;border:0;outline:0;background:none;width:100%;resize:none}
textarea{flex:1;min-height:30vh}
.fld{background:var(--chip);border-radius:10px;padding:10px 12px;margin-top:6px}
.btn{background:var(--acc);color:var(--card);border-radius:14px;padding:9px 16px;margin-top:8px;font-weight:500}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--mut);padding:20px;font-size:13px}
.empty svg{width:34px;height:34px;opacity:.6}
.line{padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.line small{display:block;color:var(--mut);font-size:12px;margin-bottom:2px}
.line.err{color:var(--err)}
.row{display:flex;flex-direction:column;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.row .lbl{font-weight:500}
.lang{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.lang button{padding:7px 16px;border-radius:16px;background:var(--chip)}
.lang button.on{background:var(--acc);color:var(--card);font-weight:500}
.note{font-size:12px;color:var(--mut);margin-top:6px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);padding:4px 0}
nav button span{padding:3px 16px;border-radius:14px;display:block;line-height:0}
nav button.on{color:var(--ink);font-weight:500}
nav button.on span{background:var(--accbg);color:var(--acc)}
[hidden]{display:none!important}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h4"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
<symbol id="i-src" viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v11H3zM3 11h18"/></symbol>
<symbol id="i-cup" viewBox="0 0 24 24"><path d="M8 4h8v6a4 4 0 0 1-8 0zM8 6H4v2a3 3 0 0 0 4 3M16 6h4v2a3 3 0 0 1-4 3M12 14v4M8 20h8"/></symbol>
<symbol id="i-set" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/></symbol>

<symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></symbol>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></symbol>
</defs></svg>

<div id="app">
  <div class="top"><div class="logo"></div><h1>Foresight</h1></div>
  <div class="chips"><span class="chip" data-i="powered"></span></div>
  <div class="rec" id="rec">
    <span class="dot"></span><span id="time">00:00</span><div id="wave"></div>
    <button id="pp" aria-label="Record"><svg><use href="#i-play"/></svg></button>
  </div>

  <main>
    <section id="s-meet" class="on">
      <div class="head">
        <button class="rb" aria-label="Back"><svg><use href="#i-back"/></svg></button>
        <button class="rb" aria-label="Calendar"><svg><use href="#i-cal"/></svg></button>
      </div>
      <h2 class="big" data-i="mtitle"></h2>
      <div class="meta"><span class="chip" data-i="mdate"></span><span class="chip">Zoom</span></div>
      <div class="tabs" id="tabs">
        <button class="tab on" data-t="notes" data-i="notes"></button>
        <button class="tab" data-t="chat" data-i="chat"></button>
        <button class="tab" data-t="summary" data-i="summary"></button>
        <button class="tab" data-t="tr" data-i="tr"></button>
        <button class="tab" data-t="qa" data-i="qa"></button>
      </div>

      <div class="card" id="p-notes">
        <div class="seg" id="seg"><button class="on" data-p="short" data-i="short"></button><button data-p="enh" data-i="enh"></button></div>
        <div id="pane-short" style="display:flex;flex-direction:column;flex:1">
          <div class="lab"><span data-i="short"></span><span class="badge" data-i="live"></span></div>
          <textarea id="note" data-ph="ph"></textarea>
        </div>
        <div id="pane-enh" class="empty" style="display:none"><svg><use href="#i-spark"/></svg><span data-i="emptyenh"></span></div>
      </div>

      <div class="card" id="p-chat" hidden><div class="empty"><svg><use href="#i-chat"/></svg><span data-i="chatempty"></span></div></div>
      <div class="card" id="p-summary" hidden><div class="empty"><svg><use href="#i-doc"/></svg><span data-i="sumempty"></span></div></div>
      <div class="card" id="p-tr" hidden>
        <div class="tool"><span class="sp"></span><button id="am" aria-label="Smaller">A−</button><button id="ap" aria-label="Larger">A+</button></div>
        <div id="trbox"><div class="empty" id="trhint"><span data-i="trhint"></span></div></div>
      </div>
      <div class="card" id="p-qa" hidden><div class="empty"><svg><use href="#i-spark"/></svg><span data-i="qaempty"></span></div></div>
    </section>

    <section id="s-ask"><h2 class="big" data-i="ask"></h2>
      <div class="card"><div class="empty"><svg><use href="#i-chat"/></svg><span data-i="askempty"></span></div></div></section>

    <section id="s-src"><h2 class="big" data-i="sources"></h2>
      <div class="row"><span data-i="srcfiles"></span></div>
      <div class="row"><span data-i="srcdocs"></span></div></section>

    <section id="s-stats"><h2 class="big" data-i="stats"></h2>
      <div class="row"><span class="big" style="margin:0">0</span><span data-i="statm"></span></div></section>

    <section id="s-set"><h2 class="big" data-i="settings"></h2>
      <div class="row"><span class="lbl" data-i="langl"></span>
        <div class="lang" id="lang"><button data-l="en">English</button><button data-l="ru">Русский</button></div></div>
      <div class="row"><span class="lbl" data-i="themel"></span>
        <div class="lang" id="theme"><button data-th="auto" data-i="auto"></button><button data-th="light" data-i="light"></button><button data-th="dark" data-i="dark"></button></div></div>
      <div class="row"><span class="lbl" data-i="keyl"></span>
        <input class="fld" id="gkey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" data-ph="keyph">
        <button class="btn" id="savekey" data-i="save"></button>
        <span class="note" data-i="keynote"></span></div>
      <div class="row"><span class="lbl" data-i="modell"></span>
        <input class="fld" id="gmodel" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="btn" id="savemodel" data-i="save"></button>
        <span class="note" data-i="modelnote"></span></div>
      <span class="note" id="saved"></span></section>
  </main>

  <nav id="nav">
    <button class="on" data-s="meet"><span><svg><use href="#i-doc"/></svg></span><i data-i="meetings" style="font-style:normal"></i></button>
    <button data-s="ask"><span><svg><use href="#i-chat"/></svg></span><i data-i="ask" style="font-style:normal"></i></button>
    <button data-s="src"><span><svg><use href="#i-src"/></svg></span><i data-i="sources" style="font-style:normal"></i></button>
    <button data-s="stats"><span><svg><use href="#i-cup"/></svg></span><i data-i="stats" style="font-style:normal"></i></button>
    <button data-s="set"><span><svg><use href="#i-set"/></svg></span><i data-i="settings" style="font-style:normal"></i></button>
  </nav>
</div>

<script>
const DEFMODEL="gemini-2.5-flash";
const T={
en:{meetings:"Meetings",ask:"Ask",sources:"Sources",stats:"Stats",settings:"Settings",powered:"Powered by EmbeddingGemma 2",mtitle:"EmbeddingGemma 2 Launch with Foresight",mdate:"Fri, Oct 2, 2026",notes:"Notes",chat:"Chat",summary:"Summary",tr:"Transcript",qa:"Live Q&A",short:"Shorthand notes",enh:"Live enhanced notes",live:"Live",ph:"Jot quick points here…",emptyenh:"Live enhanced notes will appear here as shorthand notes are written.",chatempty:"Ask anything about this meeting.",sumempty:"The summary will appear after the meeting.",qaempty:"Questions raised in the meeting will be answered here from your sources.",trhint:"Press the red dot to start recording. The text will appear here.",askempty:"Ask about any meeting or source.",srcfiles:"PDF, Office, text and Markdown files",srcdocs:"Google Docs and web bookmarks",statm:"Meetings recorded",langl:"Language",themel:"Theme",auto:"Auto",light:"Light",dark:"Dark",keyl:"Gemini API key",keyph:"Paste key here",save:"Save",keynote:"Stored only on this phone. Never sent anywhere except Google.",modell:"Model name",modelnote:"Default: gemini-2.5-flash. Change it if Google reports the model is unavailable.",saved:"Saved.",nokey:"Add your Gemini API key in Settings first.",micerr:"Microphone error",empty:"No speech recognized in this part.",noapi:"Request failed"},
ru:{meetings:"Встречи",ask:"Вопросы",sources:"Источники",stats:"Статистика",settings:"Настройки",powered:"На базе EmbeddingGemma 2",mtitle:"Запуск EmbeddingGemma 2 с Foresight",mdate:"Пт, 2 окт 2026",notes:"Заметки",chat:"Чат",summary:"Итоги",tr:"Расшифровка",qa:"Вопросы live",short:"Краткие заметки",enh:"Расширенные заметки",live:"Live",ph:"Записывайте короткие пункты…",emptyenh:"Расширенные заметки появятся здесь по мере записи кратких.",chatempty:"Спросите что угодно об этой встрече.",sumempty:"Итоги появятся после встречи.",qaempty:"Вопросы со встречи получат ответы здесь из ваших источников.",trhint:"Нажмите красную точку, чтобы начать запись. Текст появится здесь.",askempty:"Спросите о любой встрече или источнике.",srcfiles:"Файлы PDF, Office, текст и Markdown",srcdocs:"Google Docs и закладки сайтов",statm:"Записано встреч",langl:"Язык",themel:"Тема",auto:"Авто",light:"Светлая",dark:"Тёмная",keyl:"Ключ Gemini API",keyph:"Вставьте ключ сюда",save:"Сохранить",keynote:"Хранится только на этом телефоне. Отправляется только в Google.",modell:"Название модели",modelnote:"По умолчанию: gemini-2.5-flash. Меняйте, если Google сообщит, что модель недоступна.",saved:"Сохранено.",nokey:"Сначала добавьте ключ Gemini в Настройках.",micerr:"Ошибка микрофона",empty:"В этом фрагменте речь не распознана.",noapi:"Запрос не выполнен"}
};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang="en";
function setLang(l){
  if(!T[l])l="en";
  lang=l;document.documentElement.lang=l;
  $$("[data-i]").forEach(e=>e.textContent=T[l][e.dataset.i]);
  $$("[data-ph]").forEach(e=>e.placeholder=T[l][e.dataset.ph]);
  $$("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===l));
  store.set("lang",l);
}
function setTheme(t){
  if(t==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.dataset.theme=t;
  $$("#theme button").forEach(b=>b.classList.toggle("on",b.dataset.th===t));
  store.set("theme",t);
}
function show(id){
  $$("main > section").forEach(s=>s.classList.toggle("on",s.id==="s-"+id));
  $$("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.s===id));
  $("main").scrollTop=0;
}
$("#nav").onclick=e=>{const b=e.target.closest("button");if(b)show(b.dataset.s)};
$("#tabs").onclick=e=>{const b=e.target.closest(".tab");if(!b)return;
  $$("#tabs .tab").forEach(t=>t.classList.toggle("on",t===b));
  ["notes","chat","summary","tr","qa"].forEach(k=>$("#p-"+k).hidden=k!==b.dataset.t)};
$("#seg").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  $$("#seg button").forEach(x=>x.classList.toggle("on",x===b));
  const sh=b.dataset.p==="short";
  $("#pane-short").style.display=sh?"flex":"none";$("#pane-enh").style.display=sh?"none":"flex"};
$("#lang").onclick=e=>{const b=e.target.closest("button");if(b)setLang(b.dataset.l)};
$("#theme").onclick=e=>{const b=e.target.closest("button");if(b)setTheme(b.dataset.th)};
let fs=15;
function font(d){fs=Math.min(22,Math.max(12,fs+d));$("#trbox").style.fontSize=fs+"px"}
$("#am").onclick=()=>font(-1);$("#ap").onclick=()=>font(1);

// Settings: key and model stored only in this phone's localStorage
$("#gkey").value=store.get("gkey")||"";
$("#gmodel").value=store.get("gmodel")||DEFMODEL;
function flashSaved(){$("#saved").textContent=T[lang].saved;setTimeout(()=>$("#saved").textContent="",1500)}
$("#savekey").onclick=()=>{store.set("gkey",$("#gkey").value.trim());flashSaved()};
$("#savemodel").onclick=()=>{store.set("gmodel",$("#gmodel").value.trim()||DEFMODEL);flashSaved()};

// Short notes: saved as you type, restored after reload
$("#note").value=store.get("notes")||"";
$("#note").addEventListener("input",()=>store.set("notes",$("#note").value));

// Transcript output
let trLog=[];
try{trLog=JSON.parse(store.get("trlog")||"[]")}catch(e){trLog=[]}
function drawLine(item){
  const hint=$("#trhint");if(hint)hint.remove();
  const d=document.createElement("div");
  d.className="line"+(item.kind==="error"?" err":"");
  const s=document.createElement("small");s.textContent=item.time;
  const p=document.createElement("span");p.textContent=item.text;
  d.appendChild(s);d.appendChild(p);
  $("#trbox").appendChild(d);
  d.scrollIntoView({block:"end"});
}
function addLine(kind,text){
  const item={kind,text,time:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})};
  trLog.push(item);
  if(trLog.length>500)trLog=trLog.slice(-500);
  store.set("trlog",JSON.stringify(trLog));
  drawLine(item);
}
trLog.forEach(drawLine);

// Recording: one short clip after another, each sent for transcription
let stream=null,rec=null,running=false,segTimer=null,queue=Promise.resolve();
function pickMime(){
  if(!window.MediaRecorder||!MediaRecorder.isTypeSupported)return "";
  return ["audio/mp4","audio/webm"].find(m=>MediaRecorder.isTypeSupported(m))||"";
}
function newSeg(){
  if(!running)return;
  const mt=pickMime();
  rec=new MediaRecorder(stream,mt?{mimeType:mt}:undefined);
  const parts=[];
  rec.ondataavailable=e=>{if(e.data&&e.data.size)parts.push(e.data)};
  rec.onstop=()=>{
    const blob=new Blob(parts,{type:rec.mimeType||mt||"audio/mp4"});
    if(blob.size>2000)queue=queue.then(()=>transcribe(blob));
    if(running)newSeg();
  };
  rec.start();
  segTimer=setTimeout(()=>{if(rec&&rec.state!=="inactive")rec.stop()},12000);
}
async function startRec(){
  stream=await navigator.mediaDevices.getUserMedia({audio:true});
  running=true;newSeg();
}
function stopRec(){
  running=false;clearTimeout(segTimer);
  if(rec&&rec.state!=="inactive")rec.stop();
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
}

// Convert recorded clip to 16-bit mono WAV
async function toWav(blob){
  const AC=window.AudioContext||window.webkitAudioContext;
  const ctx=new AC();
  const audio=await ctx.decodeAudioData(await blob.arrayBuffer());
  await ctx.close();
  const ch=audio.getChannelData(0),sr=audio.sampleRate;
  const len=ch.length*2;
  const v=new DataView(new ArrayBuffer(44+len));
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,"RIFF");v.setUint32(4,36+len,true);w(8,"WAVE");w(12,"fmt ");
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  w(36,"data");v.setUint32(40,len,true);
  for(let i=0,o=44;i<ch.length;i++,o+=2){const s=Math.max(-1,Math.min(1,ch[i]));v.setInt16(o,s<0?s*0x8000:s*0x7fff,true)}
  return new Uint8Array(v.buffer);
}
function toBase64(u8){
  let s="";
  for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));
  return btoa(s);
}
async function transcribe(blob){
  const key=store.get("gkey")||"";
  const model=store.get("gmodel")||DEFMODEL;
  if(!key){addLine("error",T[lang].nokey);return}
  try{
    const wav=await toWav(blob);
    const url="https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent";
    const r=await fetch(url,{
      method:"POST",
      headers:{"Content-Type":"application/json","x-goog-api-key":key},
      body:JSON.stringify({contents:[{parts:[
        {text:"Transcribe this audio accurately. Return only the transcription text, no commentary."},
        {inline_data:{mime_type:"audio/wav",data:toBase64(wav)}}
      ]}]})
    });
    const j=await r.json().catch(()=>({}));
    if(!r.ok){addLine("error",(j.error&&j.error.message)||(T[lang].noapi+" ("+r.status+")"));return}
    const parts=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
    const text=parts.map(p=>p.text||"").join("").trim();
    addLine(text?"text":"error",text||T[lang].empty);
  }catch(e){addLine("error",String((e&&e.message)||e))}
}

// Record button and timer / wave animation
const wave=$("#wave");for(let i=0;i<30;i++)wave.appendChild(document.createElement("i"));
let sec=0,tm=null,wv=null;
function tick(){sec++;$("#time").textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}
function anim(){$$("#wave i").forEach(b=>b.style.height=(4+Math.random()*20)+"px")}
$("#pp").onclick=async()=>{
  if(!running){
    try{await startRec()}catch(e){addLine("error",T[lang].micerr+": "+(e.message||e));return}
    sec=0;$("#time").textContent="00:00";
    tm=setInterval(tick,1000);wv=setInterval(anim,140);
    $("#rec").classList.add("on");$("#pp use").setAttribute("href","#i-pause");
  }else{
    stopRec();
    clearInterval(tm);clearInterval(wv);
    $("#rec").classList.remove("on");$("#pp use").setAttribute("href","#i-play");
    $$("#wave i").forEach(b=>b.style.height="4px");
  }
};

setTheme(store.get("theme")||"auto");
setLang(store.get("lang")||((navigator.language||"").startsWith("ru")?"ru":"en"));
</script>
